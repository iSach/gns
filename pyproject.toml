[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gns"
version = "0.1.0"
requires-python = ">=3.10"
description = "Graph Network-based Simulators (Sanchez-Gonzalez et al., ICML 2020) reimplemented in PyTorch"
authors = [{ name = "Sacha Lewin", email = "sacha.lewin@uliege.be" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
  "h5py~=3.10",
  "imageio",
  "imageio-ffmpeg",
  "matplotlib",
  "numpy~=1.26.4",
  "scipy",
  "tqdm",
]

[project.optional-dependencies]
cpu = ["torch>=2.7"]
cu128 = ["torch>=2.7"]
# Only needed once, to convert the released TFRecord datasets to HDF5.
convert = ["tfrecord~=1.14.6"]

[project.urls]
paper = "https://arxiv.org/abs/2002.09405"
reference-implementation = "https://github.com/google-deepmind/deepmind-research/tree/master/learning_to_simulate"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "cuda: requires a GPU",
  "data: requires a dataset on disk",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["gns*"]

[project.scripts]
gns-train = "gns.cli.train:main"
gns-evaluate = "gns.cli.evaluate:main"
gns-render = "gns.cli.render:main"
gns-figures = "gns.cli.figures:main"
